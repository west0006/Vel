# =============================================
# Vel - 密钥配置模板
# =============================================
# 使用方法：复制为 secrets.yaml 后填入真实值
#     cp config/secrets.example.yaml config/secrets.yaml
#
# ⚠️ secrets.yaml 已在 .gitignore 中，不会入库；请不要把真实密钥写进本模板文件。
#
# 未配置时的行为（代码已容错，不会导致程序崩溃）：
#   - gaode.api_key 为空  → 位置服务不可用，日志提示"高德 API Key 未配置"
#   - bing.api_key  为空  → 搜索直接走 DuckDuckGo 降级链
#     （search_service 会检测占位符：含"你的"或长度 < 20 即视为未配置）
# =============================================

gaode:
  api_key: ""

bing:
  api_key: ""
  # endpoint: "https://api.bing.microsoft.com/v7.0/search"   # 可选，留空使用代码默认值
